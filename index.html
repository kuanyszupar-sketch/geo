nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--cd);border-bottom:1px solid var(--bd);display:flex;gap:4px;align-items:center;padding:8px 12px;overflow-x:auto;z-index:5}

main{max-width:920px;margin:auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--ac),var(--a2));color:#fff;border-radius:16px;padding:24px}.hero h1{margin:0 0 8px;font-size:26px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:14px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:12px}.g .c{margin:0}

.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--a2)}
.op{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:none;color:var(--tx);padding:10px 12px;border-radius:10px;margin-top:6px;cursor:pointer;font-size:15px}
.op.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,transparent)}.op.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,transparent)}
.tag{font-size:12px;background:var(--bd);border-radius:6px;padding:2px 7px;margin-right:4px}
ul{padding-left:20px;margin:4px 0}input,select{padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;min-width:0}
.m{padding:8px 12px;border-radius:12px;margin:6px 0;white-space:pre-wrap;max-width:92%}.m.u{background:var(--ac);color:#fff;margin-left:auto}.m.a{background:var(--bg);border:1px solid var(--bd)}
.big{font-size:34px;font-weight:700;color:var(--ac)}
